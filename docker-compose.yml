version: "3.9"

services:
  db:
    image: postgis/postgis:15-3.4
    environment:
      POSTGRES_USER: landslide
      POSTGRES_PASSWORD: landslide
      POSTGRES_DB: landslide
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U landslide"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: .
      dockerfile: Dockerfile
    environment:
      DATABASE_URL: postgresql+psycopg://landslide:landslide@db:5432/landslide
      CORS_ORIGINS: http://localhost:5173,http://127.0.0.1:5173
      LOCAL_STORAGE_DIR: /app/storage/media
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - ./storage:/app/storage

  frontend:
    image: node:20-alpine
    working_dir: /app
    volumes:
      - ./frontend:/app
    command: sh -c "npm install && npm run dev -- --host"
    environment:
      VITE_API_URL: /api/v1
    ports:
      - "5173:5173"
    depends_on:
      - backend

volumes:
  pgdata: